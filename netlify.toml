[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects and rewrites
[[redirects]]
  from = "/_astro/*"
  to = "/_astro/:splat"
  status = 200
  force = false

# Security headers.
# The CSP is deliberately Report-Only for now: the site loads Google Analytics
# and Metricool, and the Keystatic Cloud admin runs on the same origin, so the
# policy is being observed before it is enforced. Promote
# Content-Security-Policy-Report-Only to Content-Security-Policy once the
# reports come back clean.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tracker.metricool.com https://static.cloudflareinsights.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://tracker.metricool.com; media-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

# Keystatic Cloud signs in through a popup, which a strict COOP would cut off
# from its opener. The admin route is authenticated and not indexed.
[[headers]]
  for = "/keystatic/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"

# Netlify Image CDN configuration (built-in)
[[images.remote_patterns]]
  protocol = "https"
  hostname = "**"
  port = ""
  pathname = "/**"
